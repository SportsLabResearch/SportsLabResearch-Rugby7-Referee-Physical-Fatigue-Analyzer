site_name: Rugby7 Referee Physical Fatigue Analyzer
site_url: https://sportslabresearch.github.io/SportsLabResearch-Rugby7-Referee-Physical-Fatigue-Analyzer/

repo_name: SportsLabResearch/Rugby7-Referee-Physical-Fatigue-Analyzer
repo_url: https://github.com/SportsLabResearch/SportsLabResearch-Rugby7-Referee-Physical-Fatigue-Analyzer

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quick-start.md
  - User Guide: user-guide.md
  - Citation: citation.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
